
<!DOCTYPE html>
<html>
<head>
    <title>ShopLite Login</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <main class="page">

       
        <section class="left-panel">

            <header class="brand">
                <div class="logo-box"></div>
                <div class="brand-name">ShopLite</div>
            </header>

            <div class="promo">
                <h1>
                    Billing made simple
                    for small shops
                </h1>

                <p>
                    Create invoices, track payments and see
                    your sales in one place.
                </p>
            </div>

            <div class="stats">

                <div class="stat-card">
                    <h2>2 min</h2>
                    <p>to create an invoice</p>
                </div>

                <div class="stat-card">
                    <h2>10k+</h2>
                    <p>shops use ShopLite</p>
                </div>

            </div>

        </section>

     
        <section class="right-panel">

            <div class="login-content">

                <h1>Welcome back</h1>

                <p class="subtitle">
                    Log in to your ShopLite account
                </p>

                <form>

                 
                    <div class="form-group">

                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            value="hariharan@shoplite.in"
                        >

                    </div>

              
                    <div class="form-group">

                        <label for="password">Password</label>

                        <div class="password-field">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                            >

                            <button
                                type="button"
                                class="show-button"
                            >
                                Show
                            </button>

                        </div>

                    </div>

                    
                    <div class="options">

                        <div class="remember">

                            <input
                                type="checkbox"
                                id="remember"
                            >

                            <label for="remember">
                                Remember me
                            </label>

                        </div>

                        <a href="#">Forgot password?</a>

                    </div>

                    
                    <button
                        type="submit"
                        class="login-button"
                    >
                        Log in
                    </button>

                </form>

                
                <div class="divider">
                    <div class="divider-line"></div>
                    <p>or</p>
                    <div class="divider-line"></div>
                </div>

                
                <button class="google-button" type="button">

                    <div class="google-mark"></div>

                    Continue with Google

                </button>

              
                <p class="create-account">
                    New to ShopLite?
                    <a href="#">Create an account</a>
                </p>

            </div>

        </section>

    </main>

</body>
</html>
